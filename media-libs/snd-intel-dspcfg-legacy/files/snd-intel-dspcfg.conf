# Bind Intel audio to the legacy HDA driver (snd_hda_intel) instead of SOF.
#
# FydeOS v22.1 (kernel 6.6) was built without SOF, so Intel laptops always got
# the "HDA Intel PCH" card that CRAS has a UCM for. Kernel 6.12 builds SOF, and
# snd_intel_dspcfg then picks it on TGL/ADL/RPL/MTL machines with DMICs or
# SoundWire; the resulting sof-hda-dsp / sof-soundwire cards have no usable
# UCM, so speakers and HDMI/DP audio go silent (e.g. Dell XPS 17 9730).
#
# A device that needs SOF can still override this from the kernel command line
# with snd_intel_dspcfg.dsp_driver=3 (command-line options win over this file).
options snd_intel_dspcfg dsp_driver=1
